title: "L{3,4}"
author:
  name: "Léo Le Lonquer"
  url: "https://leolelonquer.github.io/blog/about/"
lang: "fr"
excerpt_separator: <!--more-->
date_format: "%B %d, %Y"
description: "L{3,4} : le blog de Léo Le Lonquer. Société, voyages, informatique et post-it."
default_thumbnail: "/assets/images/thumbnail-default.jpg"
# KaTeX : chargé seulement par les pages avec `mathjax: true` (front matter)
mathjax: false
url: https://leolelonquer.github.io
baseurl: "/blog"           # le workflow GitHub passe aussi --baseurl /blog

# Référencement (jekyll-seo-tag) : données structurées JSON-LD
social:
  name: "Léo Le Lonquer"
  links:
    - https://github.com/LeoLeLonquer

exclude:
  - Gemfile
  - Gemfile.lock
  - .obsidian/
  - CLAUDE.md
  - TODO.md
  - README.md
  - serve.sh
#url: https://leolelonquer.github.io/

# Menu

navigation:
  - {title: "Société"}
  - {title: "Voyages"}
  - {title: "Informatique"}
  - {title: "Post-it"}
  #- {file: "pages/ressources.md"}
  # - {file: "pages/amis.md"}
  # - {file: "pages/cv.html"}

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/thumbnail-default.jpg
  # Post-it : pages très courtes, gardées hors de l'index des moteurs de recherche
  # (meta robots noindex dans _layouts/default.html, absentes du sitemap)
  - scope:
      path: "_posts/tweets"
    values:
      noindex: true
      sitemap: false


# defaults:
#   -
#     scope:
#       path: ""      # empty string for all files
#       type: posts   # limit to posts
#     values:
#       is_post: true # automatically set is_post=true for all posts

#- {icon: "fa-home", sidebaricon: "fa-home", title: "Accueil", url: "/"}
  
#  - {file: "index.html"}


external:                  # shows a footer with social links - for available icons see fontawesome.com/icons
  - {title: Mail, icon: envelope, url: "mailto:leolelonquer@protonmail.com"}
  - {title: Github, icon: github, url: "https://github.com/LeoLeLonquer"}
  - {title: Subscribe, icon: rss, url: "/feed.xml"}


permalink: /:categories/:title
# permalink: /:year/:month/:day/:title.html
# Pagination Settings
pagination:
  enabled: true
  per_page: 10
  permalink: /:num/
  title: ':title - :num / :max'
  sort_field: 'date'
  sort_reverse: true
  trail: 
    before: 2
    after: 2

#comments:
#  disqus_shortname: ""    # see https://disqus.com/
#  isso_domain: ""         # see https://posativ.org/isso/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate-v2

# Ancres des titres : ids générés par kramdown (style GitHub, accents conservés :
# « Cas spécifiques » → #cas-spécifiques), utilisés par _includes/toc.html et anchor_headings.html
kramdown:
  auto_ids: true

# CSS minifiée, sans source map
sass:
  style: compressed
  sourcemap: never
