<div class="article-title">
    {% unless include.post.categories contains 'tweets' %}
    {%- assign hx = include.level | default: "h1" -%}
    <{{ hx }}><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a></{{ hx }}>
    {% endunless %}
    {%- assign date_format = site.date_format | default: "%B %d, %Y" -%}
    <time datetime="{{ include.post.date | date_to_xmlschema }}">{%- include date.html date=include.post.date -%}</time>
</div>
